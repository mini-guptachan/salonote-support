name: salonote サポート
description: salonoteに関する不具合・ご質問はこちらからお送りください。
title: "[サポート] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        顧客の氏名・電話番号・写真、ログインID、パスワードなどの個人情報は入力しないでください。
  - type: dropdown
    id: category
    attributes:
      label: お問い合わせの種類
      options:
        - アプリの操作方法
        - 不具合
        - 購入・復元
        - iCloud同期
        - アカウント・データ削除
        - その他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: アプリのバージョン
      description: 設定画面の「このアプリについて」で確認できます。
      placeholder: 例：1.0（1）
  - type: input
    id: device
    attributes:
      label: 端末とOS
      placeholder: 例：iPad Pro 13インチ / iPadOS 26.0
  - type: textarea
    id: description
    attributes:
      label: 内容
      description: 発生した操作、表示されたメッセージ、期待した動作を個人情報を含めずに記載してください。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 個人情報の確認
      options:
        - label: 顧客情報やパスワードを記載していません。
          required: true
